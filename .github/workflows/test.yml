name: Test Caption Studio
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[web,dev]"
      - run: python -m pytest
      - run: python -m ruff check caption_studio tests
      - run: python -m pip wheel . --no-deps --wheel-dir release
